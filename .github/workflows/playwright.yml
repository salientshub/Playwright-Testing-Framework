# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Playwright Tests with Allure Report — GitHub Actions CI/CD        ║
# ║  Runs tests, generates Allure report, deploys to GitHub Pages      ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: Playwright Tests with Allure Report

on:
  # Auto-trigger on push/PR to main
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Manual trigger with test suite selector
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sanity
          - regression
          - elements
          - forms
          - afw
          - widgets
          - interactions
          - bookstore

# Grant GITHUB_TOKEN write access for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time, cancel in-progress runs
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  JOB 1: Run Playwright Tests
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    name: 🧪 Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── Checkout Code ───────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ─── Setup Node.js with npm cache ────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ─── Install npm dependencies ───────────────────────────────────
      - name: 📦 Install Dependencies
        run: npm ci

      # ─── Install Playwright chromium browser ─────────────────────────
      - name: 🌐 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ─── Determine which grep tag to use ─────────────────────────────
      - name: 🏷️ Set Test Grep Filter
        id: grep
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          case "$SUITE" in
            sanity)        echo "grep=@sanity" >> $GITHUB_OUTPUT ;;
            regression)    echo "grep=@regression" >> $GITHUB_OUTPUT ;;
            elements)      echo "grep=@elements" >> $GITHUB_OUTPUT ;;
            forms)         echo "grep=@forms" >> $GITHUB_OUTPUT ;;
            afw)           echo "grep=@afw" >> $GITHUB_OUTPUT ;;
            widgets)       echo "grep=@widgets" >> $GITHUB_OUTPUT ;;
            interactions)  echo "grep=@interactions" >> $GITHUB_OUTPUT ;;
            bookstore)     echo "grep=@bookstore" >> $GITHUB_OUTPUT ;;
            *)             echo "grep=@sanity|@regression" >> $GITHUB_OUTPUT ;;
          esac

      # ─── Display selected suite in workflow log ──────────────────────
      - name: 📋 Test Suite Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Test Suite: ${{ github.event.inputs.test_suite || 'all' }}"
          echo "🔍 Grep Filter: ${{ steps.grep.outputs.grep }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─── Restore previous Allure history for trend charts ────────────
      - name: 📊 Restore Allure History
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-main

      # ─── Run Playwright Tests ────────────────────────────────────────
      - name: 🚀 Run Playwright Tests
        run: npx playwright test --grep "${{ steps.grep.outputs.grep }}"
        continue-on-error: true
        env:
          CI: true

      # ─── Copy categories config into allure-results ──────────────────
      - name: 📂 Copy Allure Categories
        if: always()
        run: |
          cp allure-categories.json allure-results/categories.json 2>/dev/null || true

      # ─── Inject environment info into allure-results ─────────────────
      - name: 🌍 Write Allure Environment Properties
        if: always()
        run: |
          cat > allure-results/environment.properties <<EOF
          Framework=Playwright
          Base.URL=https://demoqa.com
          Node.Version=$(node --version)
          OS=$(uname -s)
          Browser=Chromium
          Test.Suite=${{ github.event.inputs.test_suite || 'all' }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Runner=${{ runner.os }}
          EOF

      # ─── Copy previous history into allure-results ───────────────────
      - name: 📈 Copy Allure History
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r allure-history/history/* allure-results/history/ 2>/dev/null || true

      # ─── Generate Allure Report ──────────────────────────────────────
      - name: 📊 Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 30

      # ─── Upload Allure Report as Artifact ────────────────────────────
      - name: 📤 Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ─── Upload Playwright HTML Report as Artifact ───────────────────
      - name: 📤 Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # ─── Upload Test Results (traces/videos) on failure ──────────────
      - name: 📤 Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  JOB 2: Deploy Allure Report to GitHub Pages
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-report:
    name: 🚀 Deploy Allure Report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
