name: Playwright Tests with Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sanity
          - regression
          - elements
          - forms
          - afw
          - widgets
          - interactions
          - bookstore

# Grant GITHUB_TOKEN write access so the report can be deployed to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ─── Determine which grep tag to use ────────────────────────────
      - name: Set Test Grep Filter
        id: grep
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          case "$SUITE" in
            sanity)       echo "grep=@sanity" >> $GITHUB_OUTPUT ;;
            regression)   echo "grep=@regression" >> $GITHUB_OUTPUT ;;
            elements)     echo "grep=@elements" >> $GITHUB_OUTPUT ;;
            forms)        echo "grep=@forms" >> $GITHUB_OUTPUT ;;
            afw)          echo "grep=@afw" >> $GITHUB_OUTPUT ;;
            widgets)      echo "grep=@widgets" >> $GITHUB_OUTPUT ;;
            interactions)  echo "grep=@interactions" >> $GITHUB_OUTPUT ;;
            bookstore)    echo "grep=@bookstore" >> $GITHUB_OUTPUT ;;
            *)            echo "grep=@sanity|@regression" >> $GITHUB_OUTPUT ;;
          esac

      # ─── Restore previous Allure history for trend charts ───────────
      - name: Restore Allure History
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-main

      # ─── Run Tests ─────────────────────────────────────────────────
      - name: Run Playwright Tests
        run: npx playwright test --grep "${{ steps.grep.outputs.grep }}"
        continue-on-error: true
        env:
          CI: true

      # ─── Copy categories config into allure-results ─────────────────
      - name: Copy Allure Categories
        if: always()
        run: |
          cp allure-categories.json allure-results/categories.json 2>/dev/null || true

      # ─── Copy previous history into allure-results ──────────────────
      - name: Copy Allure History
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r allure-history/history/* allure-results/history/ 2>/dev/null || true

      # ─── Generate Allure Report ─────────────────────────────────────
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 30

      # ─── Upload Allure Report as Artifact ───────────────────────────
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ─── Upload Playwright HTML Report as Artifact ──────────────────
      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # ─── Upload Test Results for debugging ──────────────────────────
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ─── Deploy Allure Report to GitHub Pages ──────────────────────────
  deploy-report:
    name: Deploy Allure Report
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
